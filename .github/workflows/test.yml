name: Test

# Loads Maratona as a real unpacked extension in Chromium (Playwright) and runs the E2E suite against a
# simulated Crunchyroll (tests/mock.mjs, tests/fila-mock.mjs): skip intro/recap/credits, next episode, the
# menu inside the player, the queue with progress and tracks (fila-e2e.mjs) and the Support button (apoio-e2e.mjs).
on:
  push:
  workflow_dispatch:

jobs:
  chromium:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Playwright and Chromium
        run: |
          cd tests
          npm install --no-save playwright@1.63.0 jsqr pngjs
          npx playwright install --with-deps chromium

      - name: Test video
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          mkdir -p tests/media
          ffmpeg -v error -f lavfi -i testsrc2=size=320x180:rate=10 -f lavfi -i sine=frequency=330 -t 100 -c:v libvpx -b:v 150k -c:a libopus tests/media/ep.webm

      - name: E2E (pt, en, xx)
        run: |
          cd tests
          node e2e.mjs ../extension pt
          node e2e.mjs ../extension en
          node e2e.mjs ../extension xx

      - name: Queue and tracks (fila-e2e)
        run: cd tests && node fila-e2e.mjs ../extension

      - name: Support button (apoio-e2e)
        run: cd tests && node apoio-e2e.mjs ../extension

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: shots
          path: tests/shots/**
