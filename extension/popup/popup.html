<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Maratona</title>
<link rel="stylesheet" href="popup.css">
</head>
<body>
<main class="app">
  <header class="hd">
    <span class="logo" aria-hidden="true"><svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M3.5 6v12l8-6zM11.5 6v12l8-6z"/><rect x="19.5" y="6" width="2" height="12" rx=".6"/></svg></span>
    <div class="tt"><b>Maratona</b><small id="tagline"></small></div>
    <button class="sw" id="on" role="switch" aria-checked="true" type="button"><i></i></button>
  </header>

  <button class="banner" id="banner" type="button" hidden></button>

  <section class="panel">
    <h2 class="sec" id="section"></h2>
    <div class="list" id="list"></div>
  </section>

  <section class="stats" id="stats">
    <div class="big"><small id="savedLbl"></small><span id="saved">0 min</span></div>
    <div class="sm"><span id="skips"></span><span id="eps"></span></div>
  </section>

  <p class="msg" id="msg" hidden></p>

  <footer class="ft">
    <div class="row">
      <button class="lk" id="check" type="button"></button>
      <button class="lk" id="report" type="button"></button>
      <button class="help" id="help" type="button" aria-label="?" title="?">?</button>
    </div>
    <div class="row">
      <span class="sig"><span id="madeBy"></span> <a href="https://github.com/DredsGG" target="_blank" rel="noopener noreferrer">Dreds</a> · v<span id="ver"></span></span>
      <span class="langs" id="langs" role="radiogroup"></span>
    </div>
  </footer>
</main>
<script src="../src/i18n.js"></script>
<script src="popup.js"></script>
</body>
</html>
